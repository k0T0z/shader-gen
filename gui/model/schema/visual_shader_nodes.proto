message VisualShaderNodeFunction {
    option (node_caption) = "Function";
    option (node_input_port_count) = 1;
    option (node_input_port_caption) = "uv";

    option (node_output_port_count) = 1;
    option (node_output_port_caption) = "";

    option (node_category_path) = "Special/Patterns";

    option (node_description) = "Combines two simple functions (Sin, Saw or Square) evaluated on the u and v "
     "coordinates with a binary operator.";

    enum VisualShaderNodeFunctionFn {
        FUNC_SIN = 0 [(value_caption) = "Sin"];
        FUNC_SAW = 1 [(value_caption) = "Saw"];
        FUNC_SQUARE = 2 [(value_caption) = "Square"];
    };

    enum VisualShaderNodeFunctionCombiner {
