syntax = "proto3";
package gui.model.schema;

import "visual_shader_nodes.proto";

// Check https://protobuf.dev/programming-guides/best-practices/ before adding new features

message VisualShader {
    message VisualShaderNode {
        optional int32 id = 1;
        
        oneof node_type {
            VisualShaderNodeInput input = 2;
            VisualShaderNodeOutput output = 3;

            /*************************************/
            /* CONSTANTS                         */
            /*************************************/
            VisualShaderNodeFloatConstant float_constant = 4;
            VisualShaderNodeIntConstant int_constant = 5;
            VisualShaderNodeUIntConstant uint_constant = 6;
            VisualShaderNodeBooleanConstant boolean_constant = 7;
            VisualShaderNodeColorConstant color_constant = 8;
            VisualShaderNodeVec2Constant vec2_constant = 9;
            VisualShaderNodeVec3Constant vec3_constant = 10;
            VisualShaderNodeVec4Constant vec4_constant = 11;
            
            /*************************************/
            /* OPERATORS                         */
            /*************************************/
            VisualShaderNodeFloatOp float_op = 12;
            VisualShaderNodeIntOp int_op = 13;
            VisualShaderNodeUIntOp uint_op = 14;
            VisualShaderNodeVectorOp vector_op = 15;

            /*************************************/
            /* Funcs Node                        */
            /*************************************/
            VisualShaderNodeFloatFunc float_func = 16;
            VisualShaderNodeIntFunc int_func = 17;
            VisualShaderNodeUIntFunc uint_func = 18;
            VisualShaderNodeVectorFunc vector_func = 19;

            /*************************************/
            /* NOISE                             */
            /*************************************/
            VisualShaderNodeValueNoise value_noise = 20;
            VisualShaderNodePerlinNoise perlin_noise = 21;
            VisualShaderNodeVoronoiNoise voronoi_noise = 22;

            /*************************************/
            /* MISC                              */
            /*************************************/
            VisualShaderNodeDotProduct dot_product = 23;
            VisualShaderNodeVectorLen vector_len = 24;
            VisualShaderNodeClamp clamp = 25;
            VisualShaderNodeVectorDistance vector_distance = 26;
            VisualShaderNode2dVectorCompose vector_2d_compose = 27;
            VisualShaderNode3dVectorCompose vector_3d_compose = 28;
            VisualShaderNode4dVectorCompose vector_4d_compose = 29;
            VisualShaderNode2dVectorDecompose vector_2d_decompose = 30;
            VisualShaderNode3dVectorDecompose vector_3d_decompose = 31;
            VisualShaderNode4dVectorDecompose vector_4d_decompose = 32;
            VisualShaderNodeIf if_node = 33;
            VisualShaderNodeSwitch switch_node = 34;
            VisualShaderNodeIs is = 35;
            VisualShaderNodeCompare compare = 36;
        }
    }
    
    message VisualShaderConnection {
        optional int32 id = 1;
        optional int32 from_node_id = 2;
        optional int32 from_port_index = 3;
        optional int32 to_node_id = 4;
        optional int32 to_port_index = 5;
    }
    
    optional int32 id = 1;
    repeated VisualShaderNode nodes = 2;
    repeated VisualShaderConnection connections = 3;
    optional string fragment_shader_code = 4;
}
