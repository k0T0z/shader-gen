name: Windows Build

on:
  push:
    branches:
      - master-qt6
    paths-ignore:
      - '*.md'
  pull_request:
    branches:
      - master-qt6
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-windows-msvc
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Qt6
      shell: pwsh
      run: |
        Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
        .\CI\build_qt6_win64.ps1 Debug Dynamic "${{ github.workspace }}\qt6-lib"

    - name: Build Protobuf
      shell: pwsh
      run: |
        Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass

        New-Item -ItemType Directory -Path "${{ github.workspace }}\protobuf-lib"
        Write-Output "Protobuf: '${{ github.workspace }}\protobuf-lib'"
        .\CI\build_protobuf_win64.ps1 Debug Dynamic "${{ github.workspace }}\protobuf-lib"

    - name: Configure CMake
      shell: pwsh
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ github.workspace }}\qt6-lib\lib\cmake;${{ github.workspace }}\protobuf-lib\lib\cmake" -DSHADER_GEN_BUILD_TESTS=ON

    - name: Build shader-gen
      shell: pwsh
      run: cmake --build build --config Debug --parallel $env:NUMBER_OF_PROCESSORS

    - name: Populate PATH
      shell: pwsh
      run: |
        'build\bin\Debug' | Out-File -FilePath $Env:GITHUB_PATH -Encoding UTF8 -Append
        '${{ github.workspace }}\qt6-lib\bin' | Out-File -FilePath $Env:GITHUB_PATH -Encoding UTF8 -Append
        '${{ github.workspace }}\protobuf-lib\bin' | Out-File -FilePath $Env:GITHUB_PATH -Encoding UTF8 -Append

    - name: Run tests
      shell: pwsh
      env:
        QT_QPA_PLATFORM: offscreen # Required for running UI tests without a display
      run: ctest --test-dir build --parallel $env:NUMBER_OF_PROCESSORS --output-on-failure --verbose -C Debug
