name: Ubuntu GCC Build

on:
  push:
    branches:
      - master-qt6
    paths-ignore:
      - '*.md'
  pull_request:
    branches:
      - master-qt6
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-ubuntu-gcc
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake qt6-base-dev

    - name: Build Protobuf
      shell: bash
      run: |
        chmod +x ./CI/build_protobuf_ubuntu.sh
        sudo bash ./CI/build_protobuf_ubuntu.sh Debug Dynamic
        
        sudo ldconfig # Fixes: error while loading shared libraries: libabsl_log_internal_globals.so.2401.0.0: cannot open shared object file: No such file or directory

        # show missing deps for that executable
        ldd /usr/local/bin/protoc | grep "not found" -B1 || true

    - name: Configure CMake
      shell: bash
      run: cmake -B build -G "Unix Makefiles" -DSHADER_GEN_BUILD_TESTS=ON -DBUILD_SHARED_LIBS=ON

    - name: Build shader-gen
      shell: bash
      run: |
        cmake --build build --config Debug --parallel $(nproc)

        echo "Dependencies for shader-gen"
        ldd build/shader-gen

        echo "Dependencies for shader-gen-tests"
        ldd build/shader-gen-tests

    - name: Run tests
      shell: bash
      env:
        QT_QPA_PLATFORM: offscreen # Required for running UI tests without a display
      run: ctest --test-dir build --parallel $(nproc) --output-on-failure --verbose -C Debug
