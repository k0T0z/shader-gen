name: Windows GCC Build

on:
  push:
    branches:
      - master-qt6
    paths-ignore:
      - '*.md'
  pull_request:
    branches:
      - master-qt6
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-windows-gcc
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-protobuf
          mingw-w64-x86_64-make
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-python

    - name: Cache Qt6
      id: cache-qt6
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/qt6-lib
        key: qt6-${{ runner.os }}-${{ hashFiles('CI/build_qt6_win64_gcc.sh') }}
        restore-keys: |
          qt6-${{ runner.os }}-

    - name: Build Qt6
      if: steps.cache-qt6.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: |
        ./CI/build_qt6_win64_gcc.sh Debug Dynamic "${{ github.workspace }}/qt6-lib"

    - name: Configure CMake
      shell: msys2 {0}
      run: cmake -B build -G "Unix Makefiles" -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt6-lib/lib/cmake" -DCMAKE_MAKE_PROGRAM=mingw32-make -DSHADER_GEN_BUILD_TESTS=ON

    - name: Build shader-gen
      shell: msys2 {0}
      run: |
        cmake --build build --config Debug --parallel $(nproc)
        echo "Dependencies for shader-gen.exe"
        ldd build/shader-gen

        echo "Dependencies for shader-gen-tests.exe"
        ldd build/shader-gen-tests

    - name: Populate PATH
      shell: msys2 {0}
      run: |
        echo "build/bin" >> $GITHUB_PATH
        echo "${{ github.workspace }}/qt6-lib/bin" >> $GITHUB_PATH

    - name: Run tests
      shell: msys2 {0}
      env:
        QT_QPA_PLATFORM: offscreen # Required for running UI tests without a display
      run: ctest --test-dir build --parallel $(nproc) --output-on-failure --verbose -C Debug
