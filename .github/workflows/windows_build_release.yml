name: Windows Build and Release

on:
  push:
    branches:
      - master-qt6
    paths-ignore:
      - '*.md'
  workflow_dispatch:
    paths-ignore:
      - '*.md'

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 'master-qt6'
          submodules: recursive

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Qt6
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\CI\build_qt6_win64.ps1 Release Static "${{ github.workspace }}\qt6-lib"

      - name: Build Protobuf
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass

          New-Item -ItemType Directory -Path "${{ github.workspace }}\protobuf-lib-static"
          Write-Output "Protobuf: '${{ github.workspace }}\protobuf-lib-static'"
          .\CI\build_protobuf_win64.ps1 Release Static "${{ github.workspace }}\protobuf-lib-static"

      - name: Populate PATH for 'windeployqt'
        shell: pwsh
        run: |
          '${{ github.workspace }}\qt6-lib\bin' | Out-File -FilePath $Env:GITHUB_PATH -Encoding UTF8 -Append

      - name: Configure CMake
        shell: pwsh
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ github.workspace }}\qt6-lib\lib\cmake;${{ github.workspace }}\protobuf-lib-static\lib\cmake" -DCMAKE_BUILD_TYPE=Release -DSHADER_GEN_LINK_STATIC=ON -DSHADER_GEN_BUILD_PORTABLE_RELEASE_PACKAGE=ON
    
      - name: Build shader-gen
        shell: pwsh
        run: cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Create portable package
        shell: pwsh
        run: |
          cpack --config CPackConfig.cmake -G ZIP --verbose -C Release
        working-directory: build
        
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          tag_name: latest-qt6
          generate_release_notes: true
          draft: false
          token: ${{ secrets.SHADER_GEN_RELEASES_TOKEN }}
        