name: Windows Build and Release

on:
  workflow_dispatch:

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-windows
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"
  PROTOBUF_VERSION: "v29.3"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 'master-qt6'
          submodules: recursive

      - name: Cache Qt6
        id: cache-qt6-static
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\qt6-lib-static
          key: qt6-static-${{ env.QT_VERSION }}-${{ runner.os }}-${{ hashFiles('CI\build_qt6_win64.ps1') }}
          restore-keys: |
            qt6-static-${{ env.QT_VERSION }}-${{ runner.os }}-
            qt6-static-${{ runner.os }}-

      - name: Build Qt6
        if: steps.cache-qt6-static.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\CI\build_qt6_win64.ps1 Release Static "${{ github.workspace }}\qt6-lib-static" "${{ env.QT_VERSION }}"

      - name: Cache Protobuf
        id: cache-protobuf-static
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\protobuf-lib-static
          key: protobuf-static-${{ env.PROTOBUF_VERSION }}-${{ runner.os }}-${{ hashFiles('CI\build_protobuf_win64.ps1') }}
          restore-keys: |
            protobuf-static-${{ env.PROTOBUF_VERSION }}-${{ runner.os }}-
            protobuf-static-${{ runner.os }}-

      - name: Build Protobuf
        if: steps.cache-protobuf-static.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass

          New-Item -ItemType Directory -Path "${{ github.workspace }}\protobuf-lib-static" -Force
          Write-Output "Protobuf: '${{ github.workspace }}\protobuf-lib-static'"
          .\CI\build_protobuf_win64.ps1 Release Static "${{ github.workspace }}\protobuf-lib-static" "${{ env.PROTOBUF_VERSION }}"

      - name: Populate PATH for 'windeployqt'
        shell: pwsh
        run: |
          '${{ github.workspace }}\qt6-lib-static\bin' | Out-File -FilePath $Env:GITHUB_PATH -Encoding UTF8 -Append

      - name: Configure CMake
        shell: pwsh
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ github.workspace }}\qt6-lib-static\lib\cmake;${{ github.workspace }}\protobuf-lib-static\lib\cmake" -DCMAKE_BUILD_TYPE=Release -DSHADER_GEN_LINK_STATIC=ON -DSHADER_GEN_BUILD_PORTABLE_RELEASE_PACKAGE=ON -DBUILD_SHARED_LIBS=OFF
    
      - name: Build shader-gen
        shell: pwsh
        run: cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Create portable package
        shell: pwsh
        run: |
          cpack --config CPackConfig.cmake -G ZIP --verbose -C Release
        working-directory: build
        
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          tag_name: latest-qt6
          generate_release_notes: true
          draft: false
          token: ${{ secrets.SHADER_GEN_RELEASES_TOKEN }}
        