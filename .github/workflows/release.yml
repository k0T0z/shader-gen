name: Release

on:
  workflow_dispatch:

env:
  QT_VERSION: "6.12.0"
  ABSL_VERSION: "20260817.0"
  PROTOBUF_VERSION: "v36.2"

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: release-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}-${{ matrix.compiler }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 1 # Both targets publish assets to the same release tag; serialize to avoid a create-release race
      matrix:
        include:
          - name: Windows MSVC (static)
            os: windows-2022
            compiler: msvc
            shell: pwsh
            path_var: $env:GITHUB_PATH
            parallel: $env:NUMBER_OF_PROCESSORS
            qt_pre: 'Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass'
            qt_invoke: './CI/build_qt6_win64.ps1'
            generator: '-G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt6-lib-static/lib/cmake;${{ github.workspace }}/absl-lib-static/lib/cmake;${{ github.workspace }}/protobuf-lib-static/lib/cmake"'

          - name: Windows GCC (MSYS2, static)
            os: windows-2022
            compiler: msys2
            shell: msys2 {0}
            path_var: $GITHUB_PATH
            parallel: '$(nproc)'
            qt_pre: ''
            qt_invoke: 'bash ./CI/build_qt6_win64_gcc.sh'
            generator: '-G "Unix Makefiles" -DCMAKE_MAKE_PROGRAM=mingw32-make -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt6-lib-static/lib/cmake;${{ github.workspace }}/absl-lib-static/lib/cmake;${{ github.workspace }}/protobuf-lib-static/lib/cmake"'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 'master-qt6'
          submodules: recursive

      - name: Setup MSYS2
        if: matrix.compiler == 'msys2'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-python
            git
          path-type: inherit

      - name: Cache Qt6
        id: cache-qt6
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/qt6-lib-static
          key: qt6-static-${{ matrix.compiler }}-${{ env.QT_VERSION }}-${{ runner.os }}-${{ hashFiles('CI/**') }}
          restore-keys: |
            qt6-static-${{ matrix.compiler }}-${{ env.QT_VERSION }}-${{ runner.os }}-
            qt6-static-${{ matrix.compiler }}-${{ runner.os }}-

      - name: Build Qt6
        if: steps.cache-qt6.outputs.cache-hit != 'true'
        shell: ${{ matrix.shell }}
        run: |
          ${{ matrix.qt_pre }}
          ${{ matrix.qt_invoke }} Release Static "${{ github.workspace }}/qt6-lib-static" "${{ env.QT_VERSION }}"

      - name: Cache Abseil
        id: cache-absl
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/absl-lib-static
          key: absl-static-${{ matrix.compiler }}-${{ env.ABSL_VERSION }}-${{ runner.os }}-${{ hashFiles('CI/**') }}
          restore-keys: |
            absl-static-${{ matrix.compiler }}-${{ env.ABSL_VERSION }}-${{ runner.os }}-
            absl-static-${{ matrix.compiler }}-${{ runner.os }}-

      - name: Build Abseil (MSVC)
        if: matrix.compiler == 'msvc' && steps.cache-absl.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          New-Item -ItemType Directory -Path "${{ github.workspace }}/absl-lib-static" -Force
          .\CI\build_absl_win64.ps1 Release Static "${{ github.workspace }}/absl-lib-static" "${{ env.ABSL_VERSION }}"

      - name: Build Abseil (MSYS2)
        if: matrix.compiler == 'msys2' && steps.cache-absl.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          mkdir -p "${{ github.workspace }}/absl-lib-static"
          bash ./CI/build_absl_win64_gcc.sh Release Static "${{ github.workspace }}/absl-lib-static" "${{ env.ABSL_VERSION }}"

      - name: Cache Protobuf
        id: cache-protobuf
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/protobuf-lib-static
          key: protobuf-static-${{ matrix.compiler }}-${{ env.PROTOBUF_VERSION }}-${{ runner.os }}-${{ hashFiles('CI/**') }}
          restore-keys: |
            protobuf-static-${{ matrix.compiler }}-${{ env.PROTOBUF_VERSION }}-${{ runner.os }}-
            protobuf-static-${{ matrix.compiler }}-${{ runner.os }}-

      - name: Build Protobuf (MSVC)
        if: matrix.compiler == 'msvc' && steps.cache-protobuf.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          New-Item -ItemType Directory -Path "${{ github.workspace }}/protobuf-lib-static" -Force
          .\CI\build_protobuf_win64.ps1 Release Static "${{ github.workspace }}/protobuf-lib-static" "${{ env.PROTOBUF_VERSION }}" "${{ github.workspace }}/absl-lib-static"

      - name: Build Protobuf (MSYS2)
        if: matrix.compiler == 'msys2' && steps.cache-protobuf.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          mkdir -p "${{ github.workspace }}/protobuf-lib-static"
          bash ./CI/build_protobuf_win64_gcc.sh Release Static "${{ github.workspace }}/protobuf-lib-static" "${{ env.PROTOBUF_VERSION }}" "${{ github.workspace }}/absl-lib-static"

      - name: Populate PATH for 'windeployqt'
        shell: ${{ matrix.shell }}
        run: echo "${{ github.workspace }}/qt6-lib-static/bin" >> ${{ matrix.path_var }}

      - name: Configure CMake
        shell: ${{ matrix.shell }}
        run: cmake -B build ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=Release -DSHADER_GEN_LINK_STATIC=ON -DSHADER_GEN_BUILD_PORTABLE_RELEASE_PACKAGE=ON -DBUILD_SHARED_LIBS=OFF

      - name: Build shader-gen
        shell: ${{ matrix.shell }}
        run: cmake --build build --config Release --parallel ${{ matrix.parallel }}

      - name: Create portable package
        shell: ${{ matrix.shell }}
        working-directory: build
        run: cpack --config CPackConfig.cmake -G ZIP --verbose -C Release

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          tag_name: latest-qt6
          generate_release_notes: true
          draft: false
          token: ${{ secrets.SHADER_GEN_RELEASES_TOKEN }}
