name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - master-qt6

env:
  QT_VERSION: "6.12.0"
  ABSL_VERSION: "20250512.1"
  PROTOBUF_VERSION: "v36.2"

jobs:
  release:
    name: ${{ matrix.name }}
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    concurrency:
      group: release-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}-${{ matrix.compiler }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC (static)
            os: windows-2022
            compiler: msvc
            shell: pwsh
            path_var: $env:GITHUB_PATH
            parallel: $env:NUMBER_OF_PROCESSORS
            qt_pre: 'Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass'
            qt_invoke: './CI/build_qt6_win64.ps1'
            generator: '-G "Visual Studio 17 2022" -A x64'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'master-qt6' }}
          submodules: recursive

      - name: Cache Qt6
        id: cache-qt6
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/qt6-lib-static
          key: qt6-static-${{ matrix.compiler }}-${{ env.QT_VERSION }}-${{ runner.os }}-${{ hashFiles('CI/**') }}
          restore-keys: |
            qt6-static-${{ matrix.compiler }}-${{ env.QT_VERSION }}-${{ runner.os }}-
            qt6-static-${{ matrix.compiler }}-${{ runner.os }}-

      - name: Build Qt6
        if: steps.cache-qt6.outputs.cache-hit != 'true'
        run: |
          ${{ matrix.qt_pre }}
          ${{ matrix.qt_invoke }} Release Static "${{ github.workspace }}/qt6-lib-static" "${{ env.QT_VERSION }}"

      - name: Cache Abseil
        id: cache-absl
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/absl-lib-static
          key: absl-static-${{ matrix.compiler }}-${{ env.ABSL_VERSION }}-${{ runner.os }}-${{ hashFiles('CI/**') }}
          restore-keys: |
            absl-static-${{ matrix.compiler }}-${{ env.ABSL_VERSION }}-${{ runner.os }}-
            absl-static-${{ matrix.compiler }}-${{ runner.os }}-

      - name: Build Abseil (MSVC)
        if: steps.cache-absl.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          New-Item -ItemType Directory -Path "${{ github.workspace }}/absl-lib-static" -Force
          .\CI\build_absl_win64.ps1 Release Static "${{ github.workspace }}/absl-lib-static" "${{ env.ABSL_VERSION }}"

      - name: Cache Protobuf
        id: cache-protobuf
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/protobuf-lib-static
          key: protobuf-static-${{ matrix.compiler }}-${{ env.PROTOBUF_VERSION }}-${{ runner.os }}-${{ hashFiles('CI/**') }}
          restore-keys: |
            protobuf-static-${{ matrix.compiler }}-${{ env.PROTOBUF_VERSION }}-${{ runner.os }}-
            protobuf-static-${{ matrix.compiler }}-${{ runner.os }}-

      - name: Build Protobuf (MSVC)
        if: steps.cache-protobuf.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          New-Item -ItemType Directory -Path "${{ github.workspace }}/protobuf-lib-static" -Force
          .\CI\build_protobuf_win64.ps1 Release Static "${{ github.workspace }}/protobuf-lib-static" "${{ env.PROTOBUF_VERSION }}" "${{ github.workspace }}/absl-lib-static"

      - name: Populate PATH for 'windeployqt'
        run: echo "${{ github.workspace }}/qt6-lib-static/bin" >> ${{ matrix.path_var }}

      - name: Configure CMake
        run: cmake -B build ${{ matrix.generator }} -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt6-lib-static;${{ github.workspace }}/absl-lib-static;${{ github.workspace }}/protobuf-lib-static" -DCMAKE_BUILD_TYPE=Release -DSHADER_GEN_LINK_STATIC=ON -DSHADER_GEN_BUILD_PORTABLE_RELEASE_PACKAGE=ON -DBUILD_SHARED_LIBS=OFF

      - name: Build shader-gen
        run: cmake --build build --config Release --parallel ${{ matrix.parallel }}

      - name: Create portable package
        working-directory: build
        run: cpack --config CPackConfig.cmake -C Release --verbose

      - name: Resolve project version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content build/shader-gen-version.txt -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Failed to read project version from build/shader-gen-version.txt"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          name: Shader Gen v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          generate_release_notes: true
          make_latest: "true"
          draft: false
          token: ${{ secrets.SHADER_GEN_RELEASES_TOKEN }}
